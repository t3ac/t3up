 <html xmlns="http://www.w3.org/1999/xhtml" lang="en" xmlns:f="http://typo3.org/ns/fluid/ViewHelpers">
	<f:layout name="Standard" />
	<f:section name="Content">
		<f:render partial="Header.html" section="Header" arguments="{_all}" />
		<main id="content" class="RightNavigation position-relative {settings.t3upComponents.mainPadding}">
			<div class="overlay"></div> 
			<f:render.contentArea contentArea="{content.stage}" />
			<div class="container"> 
				<div class="row">
					<f:render partial="SpecialMenu/Breadcrumb" section="content" arguments="{_all}"/>
					<div class="{settings.t3upComponents.mainColWrap} col-lg-{settings.t3upComponents.mainCol}">         
						<!--TYPO3SEARCH_begin-->
					  <f:if condition="{page.pageRecord.deltitle} != '1'">
						<f:if condition="{page.pageRecord.showtitle} == 0">
								<f:then>
								  <f:format.nl2br><h1 class="{settings.t3upTypography.h1.wrap}">{title}</h1></f:format.nl2br>
								 </f:then> 
								<f:else>
								 	<h1 class="outof">{title}</h1>  
								 </f:else> 
							</f:if>
						  </f:if>
							<f:render.contentArea contentArea="{content.main}" />
						 <!--TYPO3SEARCH_end-->  
						<f:if condition="{page.pageRecord.previousnext}">
							<f:cObject typoscriptObjectPath="lib.navigation.prevnext" />
						</f:if>
					</div>                                  
					<div class="col-12 col-lg-{settings.t3upComponents.rightCol} {settings.t3upComponents.rightColWrap}"> 
						<!--TYPO3SEARCH_begin-->             
							<f:render.contentArea contentArea="{content.rightcolumn}" />
						<!--TYPO3SEARCH_end-->   

						<!-- beginn: subnavigation #nav -->
							<div class="d-none d-lg-block"> 
								<f:render partial="Submenu/Submenu" arguments="{_all}"/>
							</div>
						<!-- ende: subnavigation #nav -->   
				   </div>
				</div> 
			 </div>   
		</main>
	 </f:section>
</html>
